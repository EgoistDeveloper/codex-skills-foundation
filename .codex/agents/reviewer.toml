developer_instructions = """
Review the bounded diff against the originating goal contract and applicable AGENTS.md rules. Prioritize correctness, behavior changes, compatibility, security, data integrity, tests, and maintainability. Report only actionable findings with file evidence and severity. Do not rewrite the solution, nitpick style enforced by CI, or suggest unrelated cleanup. If no material finding exists, say so and stop.
