name: Apply validator runtime-artifact exclusion patch

on:
  push:
    branches:
      - fix/validator-exclude-eval-runs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/validator-exclude-eval-runs
          fetch-depth: 0

      - name: Exclude local eval campaigns from repository-wide scans
        shell: python
        run: |
          from pathlib import Path

          validator = Path("scripts/validate_repository.py")
          text = validator.read_text(encoding="utf-8")
          old = '    "dist",\n    "__pycache__",\n'
          new = '    "dist",\n    ".eval-runs",\n    "__pycache__",\n'
          if old not in text:
              raise SystemExit("validator exclusion anchor not found")
          if '    ".eval-runs",\n' not in text:
              text = text.replace(old, new, 1)
          validator.write_text(text, encoding="utf-8", newline="\n")

          tests = Path("tests/test_repository_validator.py")
          text = tests.read_text(encoding="utf-8")
          old = '            ".tox/example/lib/site-packages/example.py",\n'
          new = (
              '            ".tox/example/lib/site-packages/example.py",\n'
              '            ".eval-runs/codex-live-smoke/example/final-message.md",\n'
          )
          if old not in text:
              raise SystemExit("validator test anchor not found")
          if '".eval-runs/codex-live-smoke/example/final-message.md"' not in text:
              text = text.replace(old, new, 1)
          tests.write_text(text, encoding="utf-8", newline="\n")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          anchor = (
              "- Added a zero-model isolated lifecycle harness that installs Core `0.2.2`, "
              "upgrades a loopback Git marketplace to the beta candidate, reinstalls Core, "
              "installs and discovers every package, removes every package and marketplace entry, "
              "and verifies clean disposable state.\n"
          )
          addition = (
              anchor
              + "- Excluded ignored `.eval-runs` campaign artifacts from repository-wide link, "
              "secret, and placeholder scans so maintainer evidence does not poison later local bootstraps.\n"
          )
          if anchor not in text:
              raise SystemExit("changelog anchor not found")
          if "maintainer evidence does not poison later local bootstraps" not in text:
              text = text.replace(anchor, addition, 1)
          changelog.write_text(text, encoding="utf-8", newline="\n")

          Path(".github/workflows/patch-validator-exclude-eval-runs.yml").unlink()

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate_repository.py tests/test_repository_validator.py CHANGELOG.md .github/workflows/patch-validator-exclude-eval-runs.yml
          git commit -m "fix: exclude local eval campaigns from validator scans"
          git push origin HEAD:fix/validator-exclude-eval-runs
