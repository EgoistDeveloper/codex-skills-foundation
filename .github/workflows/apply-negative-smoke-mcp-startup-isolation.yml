name: Apply negative-smoke MCP startup isolation fix

on:
  push:
    branches:
      - fix/codex-negative-smoke-mcp-startup-isolation

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/codex-negative-smoke-mcp-startup-isolation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Apply process-level MCP isolation changes
        run: python .github/automation/apply_negative_mcp_startup_isolation.py

      - name: Remove temporary automation files
        shell: bash
        run: |
          rm .github/automation/apply_negative_mcp_startup_isolation.py
          rm .github/workflows/apply-negative-smoke-mcp-startup-isolation.yml

      - name: Run focused negative-smoke tests
        run: python -m unittest tests.test_codex_negative_smoke -v

      - name: Run complete repository bootstrap
        run: python scripts/bootstrap.py

      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name "EgoistDeveloper"
          git config user.email "60717140+EgoistDeveloper@users.noreply.github.com"
          git add scripts/run_codex_negative_smoke.py
          git add tests/test_codex_negative_smoke.py
          git add docs/live-smoke.md
          git add CHANGELOG.md
          git add -u .github/automation/apply_negative_mcp_startup_isolation.py
          git add -u .github/workflows/apply-negative-smoke-mcp-startup-isolation.yml
          git diff --cached --check
          git commit -m "fix: disable configured MCPs before negative smoke startup"
          git push origin HEAD:fix/codex-negative-smoke-mcp-startup-isolation
