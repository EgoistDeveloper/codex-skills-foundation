name: Apply live smoke fixture fix

on:
  push:
    branches:
      - feat/codex-live-smoke-harness
    paths:
      - ".github/workflows/apply-live-smoke-fixture-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Apply and validate
        run: |
          python scripts/apply_live_smoke_fixture_ignore.py
          python scripts/bootstrap.py
      - name: Remove one-shot automation and commit
        shell: bash
        run: |
          rm scripts/apply_live_smoke_fixture_ignore.py
          rm .github/workflows/apply-live-smoke-fixture-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: ignore generated Python cache in live fixture"
          git push origin HEAD:feat/codex-live-smoke-harness
