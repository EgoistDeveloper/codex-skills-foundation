name: Apply final v0.2.0 source

on:
  push:
    branches:
      - feat/agent-skills-foundation-v2
    paths:
      - ".automation/**"
      - ".github/workflows/apply-final-source.yml"

permissions:
  contents: write

concurrency:
  group: apply-final-v020
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out staged branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Reassemble and verify source archive
        shell: bash
        run: |
          cat .automation/final-source.b64.part-* | base64 --decode > /tmp/final-source.tar.xz
          echo "1349e3d474ff783ba640638eea2aa9f284ce15212c5c14de1d1f11523a1aeeb2  /tmp/final-source.tar.xz" | sha256sum --check -

      - name: Replace tree with audited source
        shell: bash
        run: |
          cp -a .github/workflows /tmp/staged-workflows
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xJf /tmp/final-source.tar.xz
          rm -rf .github/workflows
          mkdir -p .github
          cp -a /tmp/staged-workflows .github/workflows

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Validate final tree
        run: python scripts/bootstrap.py

      - name: Commit and push final source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: ship modular engineering foundation v0.2.0"
          git push origin HEAD:feat/agent-skills-foundation-v2
