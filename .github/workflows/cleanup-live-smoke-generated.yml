name: Clean and validate live smoke v2

on:
  push:
    branches:
      - fix/live-smoke-validity-v2
    paths:
      - ".github/workflows/cleanup-live-smoke-generated.yml"
      - "scripts/cleanup_live_smoke_generated.py"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repair branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Clean generated files
        run: python scripts/cleanup_live_smoke_generated.py

      - name: Validate repository
        run: python scripts/bootstrap.py

      - name: Remove one-shot cleanup and commit
        shell: bash
        run: |
          rm scripts/cleanup_live_smoke_generated.py
          rm .github/workflows/cleanup-live-smoke-generated.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: validate live smoke v2 implementation"
          git push origin HEAD:fix/live-smoke-validity-v2
