name: Apply effective plugin inventory isolation

on:
  push:
    branches:
      - fix/negative-smoke-effective-plugin-inventory

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/negative-smoke-effective-plugin-inventory
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Apply effective plugin inventory isolation changes
        run: python scripts/_apply_effective_plugin_inventory_fix.py

      - name: Remove temporary automation files
        shell: bash
        run: |
          rm scripts/_apply_effective_plugin_inventory_fix.py
          rm .github/workflows/apply-effective-plugin-inventory.yml

      - name: Run focused negative-smoke tests
        run: python -m unittest tests.test_codex_negative_smoke -v

      - name: Run complete repository bootstrap
        run: python scripts/bootstrap.py

      - name: Require bounded diff
        shell: bash
        run: |
          python - <<'PY'
          import subprocess

          expected = {
              ".github/workflows/apply-effective-plugin-inventory.yml",
              "CHANGELOG.md",
              "docs/live-smoke.md",
              "scripts/_apply_effective_plugin_inventory_fix.py",
              "scripts/run_codex_negative_smoke.py",
              "tests/test_codex_negative_smoke.py",
          }
          lines = subprocess.check_output(
              ["git", "status", "--short"], text=True
          ).splitlines()
          paths = {line[3:] for line in lines if len(line) >= 4}
          if paths != expected:
              raise SystemExit(f"unexpected changed paths: {sorted(paths)}")
          deleted = {
              line[3:]
              for line in lines
              if len(line) >= 4 and line[:2].strip() == "D"
          }
          expected_deleted = {
              ".github/workflows/apply-effective-plugin-inventory.yml",
              "scripts/_apply_effective_plugin_inventory_fix.py",
          }
          if deleted != expected_deleted:
              raise SystemExit(f"unexpected deleted paths: {sorted(deleted)}")
          print("bounded diff: PASS")
          PY

      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name "EgoistDeveloper"
          git config user.email "60717140+EgoistDeveloper@users.noreply.github.com"
          git add CHANGELOG.md docs/live-smoke.md scripts/run_codex_negative_smoke.py tests/test_codex_negative_smoke.py
          git add -u .github/workflows/apply-effective-plugin-inventory.yml scripts/_apply_effective_plugin_inventory_fix.py
          git commit -m "fix: isolate effective plugins in negative smoke"
          git push origin HEAD:fix/negative-smoke-effective-plugin-inventory
