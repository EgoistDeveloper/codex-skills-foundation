name: Apply archive ordering fix

on:
  push:
    branches:
      - fix/ignore-local-environments
    paths:
      - ".github/workflows/apply-archive-order-fix.yml"
      - "scripts/apply_archive_order_fix.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out fix branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Apply and validate patch
        run: |
          python scripts/apply_archive_order_fix.py
          python scripts/bootstrap.py
      - name: Remove one-shot automation and commit
        shell: bash
        run: |
          rm scripts/apply_archive_order_fix.py
          rm .github/workflows/apply-archive-order-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: canonicalize cross-platform archive bytes"
          git push origin HEAD:fix/ignore-local-environments
