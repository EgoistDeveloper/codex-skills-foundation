name: Validate foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: bootstrap (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact workflow commit to a local candidate branch
        run: git switch -c h04-ci-candidate
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Run complete bootstrap
        run: python scripts/bootstrap.py
      - name: Build exact release-candidate identity
        run: python scripts/release_candidate.py build --artifacts dist
      - name: Upload release packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engineering-foundation-packages-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  cross-platform-package-reproducibility:
    name: cross-platform package reproducibility
    needs: bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download Linux packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engineering-foundation-packages-ubuntu-latest
          path: artifacts/ubuntu
      - name: Download Windows packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engineering-foundation-packages-windows-latest
          path: artifacts/windows
      - name: Require byte-identical package outputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          linux = Path("artifacts/ubuntu")
          windows = Path("artifacts/windows")
          linux_files = {path.relative_to(linux): path for path in linux.rglob("*") if path.is_file()}
          windows_files = {path.relative_to(windows): path for path in windows.rglob("*") if path.is_file()}
          if set(linux_files) != set(windows_files):
              missing_linux = sorted(str(path) for path in set(windows_files) - set(linux_files))
              missing_windows = sorted(str(path) for path in set(linux_files) - set(windows_files))
              raise SystemExit(
                  f"artifact file-set mismatch; missing on Linux={missing_linux}, missing on Windows={missing_windows}"
              )
          mismatches = [
              str(relative)
              for relative in sorted(linux_files)
              if linux_files[relative].read_bytes() != windows_files[relative].read_bytes()
          ]
          if mismatches:
              raise SystemExit(f"cross-platform package bytes differ: {mismatches}")
          print("cross-platform package reproducibility: PASS")
          PY

  exact-artifact-qualification:
    name: exact-artifact qualification rehearsal (${{ matrix.os }})
    needs: [bootstrap, cross-platform-package-reproducibility]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact workflow commit to a local candidate branch
        run: git switch -c h04-ci-candidate
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Install validation dependencies and pinned provider CLIs
        run: |
          python -m pip install --requirement requirements-dev.txt
          npm install --global @openai/codex@0.146.0 @anthropic-ai/claude-code@2.1.220
      - name: Download exact candidate artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engineering-foundation-packages-${{ matrix.os }}
          path: artifacts/candidate
      - name: Verify candidate and release-asset fixture
        run: |
          python scripts/release_candidate.py verify --manifest artifacts/candidate/release-candidate.json --artifacts artifacts/candidate
          python -c "import hashlib,pathlib,subprocess,sys; p=pathlib.Path('artifacts/candidate/release-candidate.json'); d=hashlib.sha256(p.read_bytes()).hexdigest(); h=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(); subprocess.check_call([sys.executable,'scripts/release_candidate.py','verify-assets','--manifest',str(p),'--artifacts','artifacts/candidate','--tag','v0.3.0-beta.2','--tag-target',h,'--expected-manifest-sha256',d,'--prerelease'])"
      - name: Run complete exact-archive rehearsal without model calls
        run: |
          python scripts/run_exact_artifact_qualification.py --candidate-manifest artifacts/candidate/release-candidate.json --artifacts artifacts/candidate --output .eval-runs/exact-artifact-ci --zero-model-rehearsal
