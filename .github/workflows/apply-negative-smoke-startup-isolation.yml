name: Apply process-level negative smoke isolation fix

on:
  push:
    branches:
      - fix/codex-negative-smoke-startup-isolation

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/codex-negative-smoke-startup-isolation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Apply harness and test changes
        run: python .github/automation/apply_negative_startup_isolation.py

      - name: Remove temporary automation files
        run: |
          rm .github/automation/apply_negative_startup_isolation.py
          rm .github/workflows/apply-negative-smoke-startup-isolation.yml

      - name: Run focused negative smoke tests
        run: python -m unittest tests.test_codex_negative_smoke -v

      - name: Run complete repository bootstrap
        run: python scripts/bootstrap.py

      - name: Commit validated fix
        run: |
          git config user.name "EgoistDeveloper"
          git config user.email "60717140+EgoistDeveloper@users.noreply.github.com"
          git add -A
          git commit -m "fix: isolate negative smoke at app-server startup"
          git push origin HEAD:fix/codex-negative-smoke-startup-isolation
