name: Apply live smoke validity repair

on:
  push:
    branches:
      - fix/live-smoke-validity-v2
    paths:
      - ".github/workflows/apply-live-smoke-v2-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repair branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"

      - name: Apply audited repair
        run: python scripts/repair_apply_live_smoke_v2_fix.py

      - name: Materialize generated tree for direct review
        shell: bash
        run: |
          rm scripts/apply_live_smoke_v2_fix.py
          rm scripts/repair_apply_live_smoke_v2_fix.py
          rm .github/workflows/apply-live-smoke-v2-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: make Codex live smoke validity-first"
          git push origin HEAD:fix/live-smoke-validity-v2
